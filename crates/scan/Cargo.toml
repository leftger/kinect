[package]
name = "scan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Handheld 3D scanner for the Kinect v2: depth odometry plus TSDF surface reconstruction."

[[bin]]
name = "scan"
path = "src/main.rs"

[dependencies]
geom = { path = "../geom" }
kinect-one = { path = "../../vendor/kinect-one", default-features = false, features = [
    "parallel",
    "cpu_depth",
    "zune_color",
] }
nalgebra = "0.35"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Only needed to enumerate OpenCL platforms and pick a device for `gpu-decode`.
ocl = { version = "0.19.7", optional = true }

# Drives the live viewer window for `viewer`. Built against the glow backend
# rather than the default wgpu one, so it does not pull a second wgpu version in
# alongside the one `wgpu-decode` uses.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
], optional = true }

# Drives the WGSL port of the decoder for `wgpu-decode`.
wgpu = { version = "25", optional = true }
pollster = { version = "1", optional = true }

[features]
# Decode depth frames on the GPU via the vendored libfreenect2 OpenCL kernels.
#
# Off by default because it needs an OpenCL ICD at *runtime* (`mesa-opencl-icd`
# provides Rusticl for Intel GPUs) and the loader's dev symlink at *build* time
# (`ocl-icd-opencl-dev`), neither of which is a given on a stock machine.
#
# Kept for completeness, but note it is unusable on this machine: Rusticl
# enumerates a device and then silently never executes a kernel. See
# `examples/ocl_check.rs`.
gpu-decode = ["dep:ocl", "kinect-one/opencl_depth"]

# Decode depth frames on the GPU via the WGSL port of the same four kernels,
# driven by wgpu. Preferred over `gpu-decode` where both are enabled, because
# Vulkan compute does work here (see `examples/vk_check.rs`) where Rusticl does
# not.
#
# The decode is the stage that caps how fast frames can be captured at all --
# 5.3 fps on the CPU. Faster capture means smaller motion between frames, which
# helps the odometry rather than just saving time.
wgpu-decode = ["dep:wgpu", "dep:pollster"]

# A live window showing the scan as it builds. Needs a display.
viewer = ["dep:eframe"]

# The Vulkan diagnostics need wgpu, which is optional, so they are only built
# when the feature is on. `required-features` is cleaner than cfg-guarding each
# example's contents, and it makes `cargo run --example` fail with an
# explanation instead of a missing-main error.
[[example]]
name = "vk_check"
required-features = ["wgpu-decode"]

[[example]]
name = "vk_decode"
required-features = ["wgpu-decode"]
